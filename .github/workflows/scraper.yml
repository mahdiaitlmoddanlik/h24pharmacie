name: Scrape Duty Pharmacies

on:
  schedule:
    # Run every 6 hours (00:15, 06:15, 12:15, 18:15 UTC)
    - cron: '15 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate Prisma Client
        working-directory: app
        run: npx prisma generate

      - name: Run Telecontact Scraper & Update Schedules
        working-directory: app
        run: |
          # Resolve connection string from secret or variable
          if [ -n "$DB_FROM_SECRET" ]; then
            export DATABASE_URL="$DB_FROM_SECRET"
          elif [ -n "$DB_FROM_VAR" ]; then
            export DATABASE_URL="$DB_FROM_VAR"
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL est introuvable dans les secrets ou variables GitHub !"
            echo "Veuillez vous assurer que DATABASE_URL est renseigne dans GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo "DATABASE_URL detecte avec succes (longueur: ${#DATABASE_URL} caracteres)."
          npm run scrape:refresh
        env:
          DB_FROM_SECRET: ${{ secrets.DATABASE_URL }}
          DB_FROM_VAR: ${{ vars.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
