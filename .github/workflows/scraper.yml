name: Scrape Duty Pharmacies

on:
  schedule:
    # Run every 6 hours (00:15, 06:15, 12:15, 18:15 UTC)
    - cron: '15 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Secrets Configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret DATABASE_URL n'a pas été trouvé dans GitHub Settings > Secrets and variables > Actions !"
            echo "Veuillez vérifier que le secret s'appelle exactement DATABASE_URL et qu'il est bien enregistré."
            exit 1
          else
            echo "Secret DATABASE_URL détecté avec succès."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate Prisma Client
        working-directory: app
        run: npx prisma generate

      - name: Run Telecontact Scraper & Update Schedules
        working-directory: app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}
        run: npm run scrape:refresh
