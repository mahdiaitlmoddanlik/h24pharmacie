name: Update duty schedules

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

concurrency:
  group: update-duty-schedules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - name: Marrakech (syndicat)
        id: marrakech
        continue-on-error: true
        run: npm run scrape:marrakech -- --out tmp/syndicat-marrakech-latest.json && npm run scrape:update -- --file tmp/syndicat-marrakech-latest.json
      - name: Telecontact
        id: telecontact
        continue-on-error: true
        run: npm run scrape:telecontact -- --out tmp/telecontact-latest.json && npm run scrape:update -- --file tmp/telecontact-latest.json
      - name: Saydalia
        id: saydalia
        continue-on-error: true
        run: npm run scrape:saydalia -- --cities el-jadida,safi,meknes,oujda --out tmp/saydalia-latest.json && npm run scrape:update -- --file tmp/saydalia-latest.json
      - name: Fail if every source failed
        if: steps.marrakech.outcome == 'failure' && steps.telecontact.outcome == 'failure' && steps.saydalia.outcome == 'failure'
        run: exit 1
